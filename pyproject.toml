[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaudi"
version = "0.1.0"
description = "Ranked codebase map and query engine for AI coding agents (tree-sitter + PageRank)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evan Infantino" }]
keywords = [
  "ai",
  "agents",
  "code-map",
  "codebase",
  "pagerank",
  "static-analysis",
  "tree-sitter",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=0.7",
  "networkx>=3.2",
  "pathspec>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.urls]
Homepage = "https://github.com/Evan-LNCA/gaudi"
Repository = "https://github.com/Evan-LNCA/gaudi"
Issues = "https://github.com/Evan-LNCA/gaudi/issues"

[project.scripts]
gaudi = "gaudi.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaudi = ["assets/*", "assets/queries/*.scm"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["gaudi"]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
