[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gaudi"
version = "0.1.0"
description = "Ranked signature map for Cursor agents (tree-sitter + PageRank)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "tree-sitter>=0.25",
  "tree-sitter-language-pack>=0.7",
  "networkx>=3.2",
  "pathspec>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
gaudi = "gaudi.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gaudi = ["assets/*", "assets/queries/*.scm"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
packages = ["gaudi"]
ignore_missing_imports = true
warn_unused_ignores = true
show_error_codes = true
